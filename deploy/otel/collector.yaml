# One pipeline for everything the services emit over OTLP: traces to Jaeger,
# metrics exposed for Prometheus to scrape.
receivers:
  otlp:
    protocols:
      http: {endpoint: 0.0.0.0:4318}
      grpc: {endpoint: 0.0.0.0:4317}

processors:
  batch: {}

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls: {insecure: true}
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion: {enabled: true}   # service.name becomes a label

service:
  pipelines:
    traces: {receivers: [otlp], processors: [batch], exporters: [otlp/jaeger]}
    metrics: {receivers: [otlp], processors: [batch], exporters: [prometheus]}
