name: Eval gate

# Runs the graded eval on the real model, in single-agent and multi-agent mode, measures what a
# triage costs and how long it takes, drives the multi-agent path through the A2A agents, and
# fails if any number crosses the thresholds in evals/thresholds.json.
#
# It spends real API credit (the run stops itself at the budget in
# evals/thresholds.json: about $5 expected), so it is never on the pull-request path: weekly, and on demand
# (Actions -> Eval gate -> Run workflow). It needs the ANTHROPIC_API_KEY repository secret.
on:
  workflow_dispatch:
    inputs:
      repeats:
        description: "Runs per eval case (the model is not deterministic; more runs, more cost)"
        default: "1"
      budget:
        description: "Stop the run at this many dollars (default: total_budget_usd in evals/thresholds.json)"
        default: ""
  schedule:
    - cron: "17 6 * * 1"   # Mondays, 06:17 UTC

permissions:
  contents: read

concurrency:
  group: eval-gate
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # 40 cases x 2 modes, each with a judge: about an hour
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RAGAS_DO_NOT_TRACK: "true"
      REPEATS: ${{ inputs.repeats || '1' }}
      BUDGET: ${{ inputs.budget }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e '.[web,mcp,a2a]'

      - name: The key is configured
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::The ANTHROPIC_API_KEY repository secret is not set, so the live gate cannot run."
            exit 1
          fi

      - name: "Run the gate: live, single and multi-agent, and multi-agent over A2A"
        run: |
          mkdir -p out
          python -m hr_timeoff_agent gate --workers 6 --repeats "$REPEATS" ${BUDGET:+--budget "$BUDGET"} --out out/gate.json --summary out/gate.md

      - name: Summary
        if: always()
        run: |
          if [ -f out/gate.md ]; then cat out/gate.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Keep the full report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-gate-report
          path: out/gate.*
          if-no-files-found: ignore
