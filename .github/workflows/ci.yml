name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual only: the live job spends real API credit.
  workflow_dispatch:

jobs:
  changes:
    # The whole-stack job is the slow one. Skip it when a pull request touches only docs, diagrams
    # or README text; every push to main and every manual run still runs it.
    runs-on: ubuntu-latest
    outputs:
      stack: ${{ steps.diff.outputs.stack }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "stack=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base" "${{ github.event.pull_request.head.sha }}" | grep -qvE '^(docs/|README\.md$|HANDOFF\.md$|CONTEXT\.md$)'; then
            echo "stack=true" >> "$GITHUB_OUTPUT"
          else
            echo "stack=false" >> "$GITHUB_OUTPUT"
          fi

  offline:
    # Everything runs offline, from the committed fixtures: no API key, no
    # embedding-model download. A cache miss fails the run instead of silently
    # calling out, which also catches fixtures that drift from the prompts.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      HR_AGENT_OFFLINE: "1"
      RAGAS_DO_NOT_TRACK: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e '.[rag-eval,web,mcp,a2a,dev]'

      - name: Module boundaries (import-linter contracts in pyproject.toml)
        run: lint-imports

      - name: Interfaces (CLI flags and MCP tool contract are unchanged)
        run: python tests/test_golden.py

      - name: Ports (every adapter meets its interface)
        run: python tests/test_ports.py

      - name: Contracts (MCP tools and A2A agent cards match contracts/)
        run: python tests/test_contracts.py

      - name: Docs (every env var is documented; index and contents links resolve)
        run: python tests/test_docs.py

      - name: Guarantees (human-only decisions, tamper detection, override)
        run: python tests/test_guarantees.py

      - name: Retrieval isolation (tenant and audience filtered before ranking)
        run: python tests/test_retrieval.py

      - name: MCP tool server (read-only, tenant and audience fixed, audited, over stdio)
        run: python tests/test_mcp.py

      - name: Multi-agent path (replayable trajectories, tool allowlist, API loop, graph wiring)
        run: python tests/test_agents.py

      - name: A2A agents (task states, authorization, peer call, over the real protocol)
        run: python tests/test_a2a.py

      - name: Web app through HTTP (permissions, refusals, effects, restart, spend cap)
        run: python tests/test_web.py

      - name: Identity (tokens, directory mapping, browser flow and its attacks, agents, MCP guard; fake IdP)
        run: python tests/test_oidc.py

      - name: Failure behaviour (model outage, crashes mid-decision, repeats, races, slow peer)
        run: python tests/test_resilience.py

      - name: Deployment pieces (file secrets, readiness, MCP host allowlist, embedding cache)
        run: python tests/test_deploy.py

      - name: Recording backend (claude-cli, with the subprocess faked)
        run: python tests/test_llm.py

      - name: Eval suite integrity (each case exercises what it claims, labels follow the rules, hostile passages are retrieved)
        run: python tests/test_eval_suite.py

      - name: Eval gate logic (thresholds, metering, refuses to pass untested, A2A multi-agent check)
        run: python tests/test_gate.py

      - name: Eval gate plumbing, replayed from the fixtures (no model)
        run: python -m hr_timeoff_agent gate --replay

      - name: Graded eval, 40 cases incl. attacks (fails on a wrong action, a self-approval, an approval on a blocking failure, or a successful attack)
        run: python -m hr_timeoff_agent eval

      - name: Graded eval, multi-agent (replays recorded trajectories through the real MCP tools)
        run: python -m hr_timeoff_agent eval --agents multi

      - name: RAGAS retrieval eval (floors sit just under the committed baseline)
        run: python -m hr_timeoff_agent rag-eval --min-recall 0.9 --min-precision 0.55

      - name: End-to-end self-test (every guarantee, pass/fail)
        run: python -m hr_timeoff_agent e2e

  durable:
    # The same web and A2A suites, plus the restart/sharing tests, against a real
    # Postgres and Qdrant server instead of local files. Still offline for models.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: hr, POSTGRES_PASSWORD: hr, POSTGRES_DB: hr}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hr -d hr" --health-interval 3s --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports: ["6333:6333"]
    env:
      HR_AGENT_OFFLINE: "1"
      HR_DATABASE_URL: postgresql://hr:hr@localhost:5432/hr
      HR_DATABASE_SCHEMA: auto
      HR_QDRANT_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e '.[web,mcp,a2a,postgres]'

      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:6333/readyz && exit 0; sleep 2; done
          echo "qdrant did not become ready"; exit 1

      - name: Durable state (restarts, two processes, concurrent ids, A2A tasks, Qdrant)
        run: python tests/test_durable.py

      - name: Web app on Postgres and Qdrant
        run: python tests/test_web.py

      - name: A2A agents with Postgres task stores
        run: python tests/test_a2a.py

      - name: Failure behaviour with two processes sharing Postgres
        run: python tests/test_resilience.py

      - name: Migrations, locks (no deadlock with LangGraph's index build), two services starting at once
        run: python tests/test_deploy.py

  identity:
    # The same flows against a real Keycloak running the development realm:
    # the authorization-code flow through its login page, access tokens, client credentials.
    runs-on: ubuntu-latest
    env:
      HR_AGENT_OFFLINE: "1"
      HR_OIDC_ISSUER: http://localhost:8080/realms/hr
      HR_OIDC_CLIENT_SECRET: hr-web-dev-secret
      HR_OIDC_SERVICE_CLIENT_SECRET: timeoff-agent-dev-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e '.[web,mcp,a2a]'

      - name: Start Keycloak with the development realm
        run: |
          docker run -d --name keycloak -p 8080:8080 \
            -e KC_HOSTNAME=http://localhost:8080 -e KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -v "$PWD/deploy/keycloak/hr-realm.json:/opt/keycloak/data/import/hr-realm.json:ro" \
            quay.io/keycloak/keycloak:26.2 start-dev --import-realm
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/realms/hr/.well-known/openid-configuration >/dev/null && exit 0
            sleep 3
          done
          docker logs keycloak
          exit 1

      - name: Sign-in, tokens and agents against Keycloak
        run: python tests/test_keycloak.py

  observability:
    # Traces and metrics, in memory and through the real pipeline: OTLP into a
    # collector, traces in Jaeger, metrics and the alert rules in Prometheus.
    runs-on: ubuntu-latest
    env:
      HR_AGENT_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e '.[web,mcp,a2a,otel]'

      - name: Telemetry (spans per graph node, trace across the A2A hops, metrics, no free text, off by default)
        run: python tests/test_telemetry.py

      - name: Alert rules (promtool check and unit tests)
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/p:ro" --entrypoint promtool prom/prometheus:v3.1.0 check rules /p/alerts.yml
          docker run --rm -v "$PWD/deploy/prometheus:/p:ro" --entrypoint promtool prom/prometheus:v3.1.0 test rules /p/alerts_test.yml

      - name: Start the collector, Jaeger and Prometheus
        run: |
          docker compose -f docker-compose.dev.yml up -d otel-collector jaeger prometheus
          for i in $(seq 1 40); do
            curl -sf http://localhost:16686/api/services >/dev/null && curl -sf http://localhost:9090/-/ready >/dev/null && exit 0
            sleep 3
          done
          docker compose -f docker-compose.dev.yml logs
          exit 1

      - name: Through the real pipeline (one trace in Jaeger, numbers and rules in Prometheus)
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318
          HR_JAEGER_URL: http://localhost:16686
          HR_PROMETHEUS_URL: http://localhost:9090
        run: python tests/test_observability_stack.py

  stack:
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    # The whole thing, as containers: build the image (embedding models baked in), start Postgres,
    # Qdrant, Keycloak, the observability pipeline, the web app, both A2A agents and the MCP
    # server with file-based secrets, then drive it from outside over real HTTP.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the test client side
        run: pip install -e '.[web,mcp,a2a]'

      - name: Generate secrets
        run: python scripts/make_secrets.py

      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 600

      - name: Smoke test through the whole stack
        run: python tests/test_stack.py

      - name: Services keep working across a restart
        run: |
          docker compose restart web a2a mcp
          docker compose up -d --wait --wait-timeout 300
          curl -sf http://localhost:8000/readyz && curl -sf http://localhost:8100/readyz && curl -sf http://localhost:8200/healthz

      - name: Logs, if anything failed
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v

  live:
    # Real model calls, recorded into a scratch cache so nothing in the repo
    # changes. Needs the ANTHROPIC_API_KEY repository secret; run it from the
    # Actions tab ("Run workflow").
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      RAGAS_DO_NOT_TRACK: "true"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e '.[rag-eval,web,mcp,a2a]'

      - name: End-to-end self-test, including live API checks
        run: python -m hr_timeoff_agent e2e --require-live
