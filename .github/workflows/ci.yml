name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual only: the live job spends real API credit.
  workflow_dispatch:

jobs:
  offline:
    # Everything runs offline, from the committed fixtures: no API key, no
    # embedding-model download. A cache miss fails the run instead of silently
    # calling out, which also catches fixtures that drift from the prompts.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      HR_AGENT_OFFLINE: "1"
      RAGAS_DO_NOT_TRACK: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e '.[rag-eval,web,mcp,a2a]'

      - name: Guarantees (human-only decisions, tamper detection, override)
        run: python tests/test_guarantees.py

      - name: Retrieval isolation (tenant and audience filtered before ranking)
        run: python tests/test_retrieval.py

      - name: MCP tool server (read-only, tenant and audience fixed, audited, over stdio)
        run: python tests/test_mcp.py

      - name: Multi-agent path (replayable trajectories, tool allowlist, API loop, graph wiring)
        run: python tests/test_agents.py

      - name: A2A agents (task states, authorization, peer call, over the real protocol)
        run: python tests/test_a2a.py

      - name: Web app through HTTP (permissions, refusals, effects, restart, spend cap)
        run: python tests/test_web.py

      - name: Recording backend (claude-cli, with the subprocess faked)
        run: python tests/test_llm.py

      - name: Graded eval (fails if any action mismatches or the agent self-approves)
        run: python -m hr_timeoff_agent eval

      - name: Graded eval, multi-agent (replays recorded trajectories through the real MCP tools)
        run: python -m hr_timeoff_agent eval --agents multi

      - name: RAGAS retrieval eval (floors sit just under the committed baseline)
        run: python -m hr_timeoff_agent rag-eval --min-recall 0.9 --min-precision 0.55

      - name: End-to-end self-test (every guarantee, pass/fail)
        run: python -m hr_timeoff_agent e2e

  durable:
    # The same web and A2A suites, plus the restart/sharing tests, against a real
    # Postgres and Qdrant server instead of local files. Still offline for models.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: hr, POSTGRES_PASSWORD: hr, POSTGRES_DB: hr}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hr -d hr" --health-interval 3s --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports: ["6333:6333"]
    env:
      HR_AGENT_OFFLINE: "1"
      HR_DATABASE_URL: postgresql://hr:hr@localhost:5432/hr
      HR_DATABASE_SCHEMA: auto
      HR_QDRANT_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e '.[web,mcp,a2a,postgres]'

      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:6333/readyz && exit 0; sleep 2; done
          echo "qdrant did not become ready"; exit 1

      - name: Durable state (restarts, two processes, concurrent ids, A2A tasks, Qdrant)
        run: python tests/test_durable.py

      - name: Web app on Postgres and Qdrant
        run: python tests/test_web.py

      - name: A2A agents with Postgres task stores
        run: python tests/test_a2a.py

  live:
    # Real model calls, recorded into a scratch cache so nothing in the repo
    # changes. Needs the ANTHROPIC_API_KEY repository secret; run it from the
    # Actions tab ("Run workflow").
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      RAGAS_DO_NOT_TRACK: "true"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e '.[rag-eval,web,mcp,a2a]'

      - name: End-to-end self-test, including live API checks
        run: python -m hr_timeoff_agent e2e --require-live
