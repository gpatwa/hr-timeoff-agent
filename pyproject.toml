[project]
name = "hr-timeoff-agent"
version = "0.1.0"
description = "A time-off triage agent that recommends but cannot approve, with a tamper-evident evidence trail and a graded eval."
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.6",
    "anthropic>=0.69",
    "pydantic>=2.7",
    "qdrant-client>=1.12",
    "fastembed>=0.5",
]

[project.optional-dependencies]
# RAGAS for the retrieval eval. ragas 0.4 imports a module langchain-community
# removed in 0.4, so that pin is needed until ragas catches up.
# The local web app: FastAPI, server-rendered pages, SQLite for paused runs.
web = [
    "PyJWT[crypto]>=2.8",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "langgraph-checkpoint-sqlite>=2.0",
    "httpx>=0.27",
]
# The HR tools as an MCP server, and the client the agents use to reach them.
mcp = [
    "mcp>=2.2",
]
# The time-off agent and the payroll agent as A2A agents. They sit on the same
# workspace the web app uses, so this needs the web extra's dependencies too.
a2a = [
    "PyJWT[crypto]>=2.8",
    "a2a-sdk[http-server]>=1.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "langgraph-checkpoint-sqlite>=2.0",
    "httpx>=0.27",
]
# Durable state: Postgres (workspace, paused runs, A2A tasks) and a Qdrant server.
# Set HR_DATABASE_URL and HR_QDRANT_URL to use them; without, everything is local files.
postgres = [
    "psycopg[binary,pool]>=3.2",
    "langgraph-checkpoint-postgres>=2.0",
    "sqlalchemy[asyncio]>=2.0",
]
rag-eval = [
    "ragas>=0.4,<0.5",
    "langchain-community<0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hr_timeoff_agent*"]

[tool.setuptools.package-data]
"hr_timeoff_agent.web" = ["templates/*.html", "static/*.css"]
