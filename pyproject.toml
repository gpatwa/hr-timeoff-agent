[project]
name = "hr-timeoff-agent"
version = "0.1.0"
description = "A time-off triage agent that recommends but cannot approve, with a tamper-evident evidence trail and a graded eval."
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.6",
    "anthropic>=0.69",
    "pydantic>=2.7",
    "qdrant-client>=1.12",
    "fastembed>=0.5",
]

[project.optional-dependencies]
# Enforces the module boundaries in [tool.importlinter] below; run `lint-imports`.
dev = ["import-linter>=2.0"]
# RAGAS for the retrieval eval. ragas 0.4 imports a module langchain-community
# removed in 0.4, so that pin is needed until ragas catches up.
# The local web app: FastAPI, server-rendered pages, SQLite for paused runs.
web = [
    "PyJWT[crypto]>=2.8",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "langgraph-checkpoint-sqlite>=2.0",
    "httpx>=0.27",
]
# The HR tools as an MCP server, and the client the agents use to reach them.
mcp = [
    "mcp>=2.2",
]
# The time-off agent and the payroll agent as A2A agents. They sit on the same
# workspace the web app uses, so this needs the web extra's dependencies too.
a2a = [
    "PyJWT[crypto]>=2.8",
    "a2a-sdk[http-server]>=1.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "langgraph-checkpoint-sqlite>=2.0",
    "httpx>=0.27",
]
# Durable state: Postgres (workspace, paused runs, A2A tasks) and a Qdrant server.
# Set HR_DATABASE_URL and HR_QDRANT_URL to use them; without, everything is local files.
postgres = [
    "psycopg[binary,pool]>=3.2",
    "langgraph-checkpoint-postgres>=2.0",
    "sqlalchemy[asyncio]>=2.0",
]
# Traces and metrics over OTLP/HTTP. Off unless OTEL_EXPORTER_OTLP_ENDPOINT or HR_OTEL=1 is set.
otel = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]
rag-eval = [
    "ragas>=0.4,<0.5",
    "langchain-community<0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hr_timeoff_agent*"]

[tool.setuptools.package-data]
"hr_timeoff_agent.services.web" = ["templates/*.html", "static/*.css"]

# Module boundaries (docs/refactor-plan.md). The packages are layers: each may import only the ones below it,
# and the two front doors under services/ may not import each other. A contract that is broken for a good
# reason lists the offending import under ignore_imports; the list is empty today and may only shrink.
[tool.importlinter]
root_package = "hr_timeoff_agent"
include_external_packages = false

[[tool.importlinter.contracts]]
name = "layers: cli > eval_harness > clicommon > services > agent > hr_tools > adapters > core"
type = "layers"
layers = [
    "hr_timeoff_agent.cli",
    "hr_timeoff_agent.eval_harness",
    "hr_timeoff_agent.clicommon",
    "hr_timeoff_agent.services",
    "hr_timeoff_agent.agent",
    "hr_timeoff_agent.hr_tools",
    "hr_timeoff_agent.adapters",
    "hr_timeoff_agent.core",
]

[[tool.importlinter.contracts]]
name = "the front doors (web, A2A) do not import each other; both use agent.workspace"
type = "layers"
layers = ["hr_timeoff_agent.services.web | hr_timeoff_agent.services.a2a"]

[[tool.importlinter.contracts]]
name = "the agent runtime does not reach into the tool server; assembly alone builds it"
type = "forbidden"
source_modules = ["hr_timeoff_agent.agent.agentloop", "hr_timeoff_agent.agent.agents", "hr_timeoff_agent.agent.graph", "hr_timeoff_agent.agent.workspace", "hr_timeoff_agent.hr_tools.client"]
forbidden_modules = ["hr_timeoff_agent.hr_tools.server"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "graph (nodes) does not import agents; assembly joins them"
type = "forbidden"
source_modules = ["hr_timeoff_agent.agent.graph"]
forbidden_modules = ["hr_timeoff_agent.agent.agents"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "pglock is a leaf"
type = "forbidden"
source_modules = ["hr_timeoff_agent.adapters.pglock"]
forbidden_modules = ["hr_timeoff_agent.adapters.storage", "hr_timeoff_agent.adapters.migrations", "hr_timeoff_agent.agent", "hr_timeoff_agent.services"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "migrations does not import storage; both use pglock"
type = "forbidden"
source_modules = ["hr_timeoff_agent.adapters.migrations"]
forbidden_modules = ["hr_timeoff_agent.adapters.storage"]
allow_indirect_imports = true
