[project]
name = "hr-timeoff-agent"
version = "0.1.0"
description = "A time-off triage agent that recommends but cannot approve, with a tamper-evident evidence trail and a graded eval."
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.6",
    "anthropic>=0.69",
    "pydantic>=2.7",
    "qdrant-client>=1.12",
    "fastembed>=0.5",
]

[project.optional-dependencies]
# Enforces the module boundaries in [tool.importlinter] below; run `lint-imports`.
dev = ["import-linter>=2.0"]
# RAGAS for the retrieval eval. ragas 0.4 imports a module langchain-community
# removed in 0.4, so that pin is needed until ragas catches up.
# The local web app: FastAPI, server-rendered pages, SQLite for paused runs.
web = [
    "PyJWT[crypto]>=2.8",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "langgraph-checkpoint-sqlite>=2.0",
    "httpx>=0.27",
]
# The HR tools as an MCP server, and the client the agents use to reach them.
mcp = [
    "mcp>=2.2",
]
# The time-off agent and the payroll agent as A2A agents. They sit on the same
# workspace the web app uses, so this needs the web extra's dependencies too.
a2a = [
    "PyJWT[crypto]>=2.8",
    "a2a-sdk[http-server]>=1.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "langgraph-checkpoint-sqlite>=2.0",
    "httpx>=0.27",
]
# Durable state: Postgres (workspace, paused runs, A2A tasks) and a Qdrant server.
# Set HR_DATABASE_URL and HR_QDRANT_URL to use them; without, everything is local files.
postgres = [
    "psycopg[binary,pool]>=3.2",
    "langgraph-checkpoint-postgres>=2.0",
    "sqlalchemy[asyncio]>=2.0",
]
# Traces and metrics over OTLP/HTTP. Off unless OTEL_EXPORTER_OTLP_ENDPOINT or HR_OTEL=1 is set.
otel = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]
rag-eval = [
    "ragas>=0.4,<0.5",
    "langchain-community<0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hr_timeoff_agent*"]

[tool.setuptools.package-data]
"hr_timeoff_agent.web" = ["templates/*.html", "static/*.css"]

# Module boundaries (docs/refactor-plan.md, stage 1). A contract that is already broken lists the
# offending import under ignore_imports with the stage that removes it. The lists may only shrink.
[tool.importlinter]
root_package = "hr_timeoff_agent"
include_external_packages = false

[[tool.importlinter.contracts]]
name = "core is pure: policy, models, evidence, config import no other part of the app"
type = "forbidden"
source_modules = ["hr_timeoff_agent.policy", "hr_timeoff_agent.models", "hr_timeoff_agent.evidence", "hr_timeoff_agent.config"]
forbidden_modules = [
    "hr_timeoff_agent.llm", "hr_timeoff_agent.graph", "hr_timeoff_agent.agents", "hr_timeoff_agent.agentloop",
    "hr_timeoff_agent.retrieval", "hr_timeoff_agent.storage", "hr_timeoff_agent.migrations", "hr_timeoff_agent.oidc",
    "hr_timeoff_agent.telemetry", "hr_timeoff_agent.mcp_server", "hr_timeoff_agent.mcp_client",
    "hr_timeoff_agent.a2a_client", "hr_timeoff_agent.a2a_common", "hr_timeoff_agent.a2a_server", "hr_timeoff_agent.a2a_payroll",
    "hr_timeoff_agent.web", "hr_timeoff_agent.cli", "hr_timeoff_agent.gate", "hr_timeoff_agent.evals",
    "hr_timeoff_agent.e2e", "hr_timeoff_agent.report", "hr_timeoff_agent.rag_eval",
]

[[tool.importlinter.contracts]]
name = "nothing in the product imports the eval and test tooling"
type = "forbidden"
source_modules = [
    "hr_timeoff_agent.policy", "hr_timeoff_agent.models", "hr_timeoff_agent.evidence", "hr_timeoff_agent.config",
    "hr_timeoff_agent.llm", "hr_timeoff_agent.graph", "hr_timeoff_agent.agents", "hr_timeoff_agent.agentloop",
    "hr_timeoff_agent.retrieval", "hr_timeoff_agent.storage", "hr_timeoff_agent.migrations", "hr_timeoff_agent.oidc",
    "hr_timeoff_agent.telemetry", "hr_timeoff_agent.mcp_server", "hr_timeoff_agent.mcp_client",
    "hr_timeoff_agent.a2a_client", "hr_timeoff_agent.a2a_common", "hr_timeoff_agent.a2a_server", "hr_timeoff_agent.a2a_payroll",
    "hr_timeoff_agent.web",
]
forbidden_modules = ["hr_timeoff_agent.gate", "hr_timeoff_agent.evals", "hr_timeoff_agent.e2e", "hr_timeoff_agent.report", "hr_timeoff_agent.rag_eval"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "the agent runtime does not import a service (web, A2A)"
type = "forbidden"
source_modules = ["hr_timeoff_agent.graph", "hr_timeoff_agent.agents", "hr_timeoff_agent.agentloop", "hr_timeoff_agent.assembly", "hr_timeoff_agent.llm", "hr_timeoff_agent.retrieval"]
forbidden_modules = ["hr_timeoff_agent.web", "hr_timeoff_agent.a2a_server", "hr_timeoff_agent.a2a_payroll", "hr_timeoff_agent.a2a_client"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "services do not import each other"
type = "forbidden"
source_modules = ["hr_timeoff_agent.a2a_server", "hr_timeoff_agent.a2a_payroll"]
forbidden_modules = ["hr_timeoff_agent.web"]
allow_indirect_imports = true
ignore_imports = [
    "hr_timeoff_agent.a2a_server -> hr_timeoff_agent.web.workspace",   # stage 5: the workspace becomes a shared library
]

[[tool.importlinter.contracts]]
name = "the agent runtime does not reach into the tool server's internals"
type = "forbidden"
source_modules = ["hr_timeoff_agent.agentloop", "hr_timeoff_agent.agents", "hr_timeoff_agent.graph"]
forbidden_modules = ["hr_timeoff_agent.mcp_server"]
allow_indirect_imports = true
ignore_imports = [
    "hr_timeoff_agent.agentloop -> hr_timeoff_agent.mcp_server",   # stage 5: depend on a tool contract, not the server
    "hr_timeoff_agent.agents -> hr_timeoff_agent.mcp_server",      # stage 5
]

[[tool.importlinter.contracts]]
name = "graph (nodes) does not import agents; assembly joins them"
type = "forbidden"
source_modules = ["hr_timeoff_agent.graph"]
forbidden_modules = ["hr_timeoff_agent.agents"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "pglock is a leaf"
type = "forbidden"
source_modules = ["hr_timeoff_agent.pglock"]
forbidden_modules = ["hr_timeoff_agent.storage", "hr_timeoff_agent.migrations", "hr_timeoff_agent.graph", "hr_timeoff_agent.web"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "migrations does not import storage; both use pglock"
type = "forbidden"
source_modules = ["hr_timeoff_agent.migrations"]
forbidden_modules = ["hr_timeoff_agent.storage"]
allow_indirect_imports = true
